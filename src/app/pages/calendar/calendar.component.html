<div class="col-12">
    <div class="row">

        <div class="col-12 col-md-3 col-sm-4 mt-5">
            <div class="card border col-12 col-sm-12 col-md-12 mx-auto p-1 h-75">
                <div class="d-flex justify-content-between align-items-center p-2">


                    <!-- <div class="text-center p-2"> -->
                    <h5>Eventos</h5>

                    <!-- </div> -->
                    <!-- <div class="d-flex justify-content-end" > -->
                    <button class="btn btn-primary btn-sm " (click)="openModal()"><i class="fas fa-plus"></i></button>
                    <!-- </div> -->
                </div>
                <ul class="list-group px-1 overflow-y-auto " id="mydraggable">
                    @for(event of eventsWithOutDate; track event.idEvent){

                    <li class="list-group-item my-1 ec-event item-class ec-draggable" [attr.data-event]="event | json">
                        <div class="ec-event-body">
                            <!-- <small class="text-white">{{orden.title}}</small> -->
                            {{event.title}}
                        </div>
                    </li>
                    }
                </ul>
            </div>
        </div>
        <div class="col-12 col-md-9 col-sm-8">
            <full-calendar [options]="calendarOptions"></full-calendar>
        </div>
    </div>
</div>
