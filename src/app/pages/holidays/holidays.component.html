
<div class="d-flex justify-content-end">
  <button mat-flat-button extended (click)="openModal()" >
      <mat-icon>favorite</mat-icon>
      Nuevo
  </button>
</div>

 <mat-form-field>
    <mat-label>Filtro
    </mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Filtro" #input>
  </mat-form-field>
  
  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort>
  
      
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Fecha </th>
        <td mat-cell *matCellDef="let row"> {{row.date}} </td>
      </ng-container>
  
      
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Descripción </th>
        <td mat-cell *matCellDef="let row"> {{row.description}}% </td>
      </ng-container>
  
      
      <ng-container matColumnDef="estatus">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Estatus </th>
        <td mat-cell *matCellDef="let row"> 
          @if(row.estatus == 'A'){
            <span class="badge bg-success">Activo</span>
          }@else {
            <!-- <span class="badge bg-success">I</span> -->

          }
        </td>
      </ng-container>
  
      
      <ng-container matColumnDef="options">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Opciones </th>
        <td mat-cell *matCellDef="let row">
          <button mat-mini-fab aria-label="Example icon button with a menu icon" (click)="edit(row)">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-mini-fab aria-label="Example icon button with a menu icon" (click)="delete(row)">
            <mat-icon>delete</mat-icon>
          </button>

        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
      
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">Sin informacion a mostrar {{input.value}}"</td>
      </tr>
    </table>
  
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </div>
